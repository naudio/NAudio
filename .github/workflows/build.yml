name: build

# Build & test on every PR, every push to main, and on demand. The .NET 10
# SDK is preinstalled on windows-latest, so no explicit setup-dotnet step is
# needed today — see Docs/Architecture/ReleaseStrategy.md for the trade-off
# if the runner image ever rotates and drops it.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore
        run: dotnet restore NAudio.slnx

      - name: Build
        run: dotnet build NAudio.slnx --configuration Release --no-restore

      - name: Test
        # `dotnet test` against the slnx runs every test project. On
        # Windows that's NAudio.Core.Tests + NAudio.Windows.Tests plus
        # the SoundFile/Alsa suites (which self-skip when their native
        # deps are absent). The --solution flag is required by newer
        # .NET 10 SDK patches; positional arg form errors out.
        run: >
          dotnet test --solution NAudio.slnx
          --configuration Release
          --no-build
          --filter "TestCategory!=IntegrationTest"
          --report-trx
          --results-directory ${{ runner.temp }}/TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults/*.trx
          if-no-files-found: warn

  aot:
    # The trim/AOT analyzers that run during the normal build only flag APIs
    # annotated [RequiresDynamicCode] / [RequiresUnreferencedCode], so they are
    # blind to whole classes of AOT breakage. Issue #1425 — marshalling a
    # [StructLayout] class by value, which CoreCLR pins in place but NativeAOT
    # copies into a temporary — produced zero analyzer warnings while being
    # thoroughly broken under AOT. Publishing NAudioAotSmokeTest runs ILC for
    # real, catching whole-program analysis and native link failures that the
    # analyzers cannot see.
    #
    # Publish only, not run: the smoke test drives real render endpoints and
    # master volume, which CI agents don't have. See tests/NAudioAotSmokeTest.
    #
    # A separate job so it runs in parallel with `build` rather than adding the
    # ILCompiler download and native link to the critical path.
    name: aot-publish
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Publish Native AOT smoke test
        # The csproj already sets PublishAot and RuntimeIdentifier=win-x64, so
        # this needs no extra flags. windows-latest ships the MSVC toolchain
        # that ILC needs for the native link step.
        run: dotnet publish tests/NAudioAotSmokeTest/NAudioAotSmokeTest.csproj --configuration Release
